[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadstudio"
version = "0.2.0"
description = "Parametrische CAD-editor + MCP-server voor Claude, export naar multi-color 3MF (Anycubic Slicer Next / Orca / Prusa)"
requires-python = ">=3.10"
dependencies = [
  "build123d>=0.9",
  "mcp>=1.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "trimesh>=4.0",
  "numpy",
  "pillow>=10",
]

[project.scripts]
cadstudio = "cadstudio.__main__:main"

[tool.setuptools]
packages = ["cadstudio"]

[tool.setuptools.package-data]
cadstudio = ["cheatsheet.md", "static/*", "static/vendor/*", "static/vendor/addons/controls/*"]
