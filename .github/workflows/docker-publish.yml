# Builds the image on every push to main and on version tags, and publishes it to ghcr.io/<owner>/cadstudio.
# Releases are automatic: when a push to main carries a version (pyproject.toml) that has no v<version> tag yet,
# the image also gets the <version> and <major>.<minor> tags, and the release job creates the tag + GitHub release.
name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Version from pyproject.toml (new = no v<version> tag yet)
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          new=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -z "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then new=true; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "version $v, new release: $new"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cadstudio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.new == 'true' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.new == 'true' }}
      - id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CADSTUDIO_COMMIT=${{ github.sha }}
            CADSTUDIO_BUILD_DATE=${{ steps.build_date.outputs.date }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # GitHub Release with the changelog section: for a pushed v* tag, or for a new version on main
    # (then this job also creates the tag; tags made with GITHUB_TOKEN don't re-trigger this workflow)
    if: startsWith(github.ref, 'refs/tags/v') || needs.build.outputs.new == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        run: |
          v="${{ needs.build.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Docker: \`ghcr.io/${{ github.repository_owner }}/cadstudio:$v\`" >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.build.outputs.version }}
          body_path: notes.md
