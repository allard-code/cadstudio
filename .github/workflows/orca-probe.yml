# TEMPORARY: probe OrcaSlicer runtime deps and a CLI slice (removed before merge)
name: orca-probe
on:
  push:
    branches: [feat/slicer]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract AppImage
        run: |
          curl -fsSL -o orca.AppImage "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.2.AppImage"
          chmod +x orca.AppImage && ./orca.AppImage --appimage-extract >/dev/null
          ls squashfs-root; head -50 squashfs-root/AppRun; ls squashfs-root/bin; du -sh squashfs-root
          ls squashfs-root/resources | head -40; ls squashfs-root/lib | head -80; ls squashfs-root/libexec; cat squashfs-root/libexec/orca-slicer-env 2>/dev/null | head -40 || file squashfs-root/libexec/orca-slicer-env
          ls -la squashfs-root/resources/profiles | head -60; ls squashfs-root/resources/profiles_template | head
          find squashfs-root -iname "*anycubic*" | head -20; find squashfs-root -iname "*.zip" -o -iname "*.tar*" | head
      - name: Anycubic profiles from the v2.5.2 source tag (fallback)
        run: |
          git clone -q --depth 1 --branch v2.5.2 --filter=blob:none --sparse https://github.com/OrcaSlicer/OrcaSlicer orca-src
          git -C orca-src sparse-checkout set --no-cone /resources/profiles/Anycubic/
          mkdir -p _profiles && cp -r orca-src/resources/profiles/Anycubic _profiles/
          ls _profiles/Anycubic/machine | grep -i "kobra s1"
      - name: Missing libs in bare python:3.13-slim
        run: |
          docker run --rm -v "$PWD/squashfs-root:/opt/orca" python:3.13-slim bash -c 'for b in /opt/orca/bin/*; do echo "== $b"; LD_LIBRARY_PATH=/opt/orca/lib:/opt/orca/usr/lib ldd "$b" | grep "not found" | sort -u; done'
      - name: Slice a cube with guessed runtime libs
        run: |
          docker run --rm -v "$PWD/squashfs-root:/opt/orca" -v "$PWD:/src" python:3.13-slim bash -c '
            set -x
            apt-get update -qq && apt-get install -y -qq --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0 libegl1 libgl1 libglu1-mesa libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libsecret-1-0 libdbus-1-3 libosmesa6 libsm6 libice6 libavcodec61 libavformat61 libavutil59 libswscale8 libmspack0 >/dev/null 2>&1 || apt-get install -y --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0 libegl1 libgl1 libglu1-mesa 2>&1 | tail -20
            for b in /opt/orca/bin/*; do echo "== $b"; ldd "$b" | grep "not found" | sort -u; done
            du -sh /usr/lib/x86_64-linux-gnu
            cd /src && PYTHONPATH=/src CADSTUDIO_ORCA_PROFILES=/src/_profiles python -c "from cadstudio import slicer; import json; print(json.dumps(slicer.selftest(), indent=1))" || true
            ls -la /tmp/cs-selftest || true
            head -c 3000 /tmp/cs-selftest/cube.gcode 2>/dev/null || true
          '
