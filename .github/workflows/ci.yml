name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python }}, mcp ${{ matrix.mcp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", mcp: "latest" }
          - { python: "3.13", mcp: "latest" }
          - { python: "3.12", mcp: "1.x" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries for OpenCASCADE
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 fonts-dejavu-core
      - name: Install
        run: |
          pip install -e ".[dev]"
          if [ "${{ matrix.mcp }}" = "1.x" ]; then pip install "mcp>=1.2,<2"; fi
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cadstudio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name cs -p 8765:8765 -e CADSTUDIO_TOKEN=ci cadstudio:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8765/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8765/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/project)" = "401"
          curl -fs -H "Authorization: Bearer ci" http://127.0.0.1:8765/api/project | grep -q '"tray"'
          # OrcaSlicer CLI inside the image: slice a cube with the default printer profile
          docker exec cs python -m cadstudio.slicer | tee slice.json
          grep -q '"filament_g"' slice.json
          # a two-bed export is a slicer project built from the image's printer profiles
          docker exec -e CADSTUDIO_HOME=/tmp/ci-mp cs python -c "
          from cadstudio import project as P; from cadstudio.export3mf import export_3mf
          import zipfile, json
          P.set_current_project('mp'); p = P.get_project('mp')
          p.upsert_part('a', code='result = Box(20, 20, 5)'); p.upsert_part('b', code='result = Box(20, 20, 5)', plate=2)
          r = export_3mf(p); cfg = json.loads(zipfile.ZipFile(r['path']).read('Metadata/project_settings.config'))
          assert cfg['printer_settings_id'] and len(cfg['filament_settings_id']) >= 1 and len(cfg) > 300, cfg.keys()
          print(r['project_settings'])"
          docker logs cs
