# docker compose up -d --build
# Also works as a Portainer stack ("Repository" → point it at this git repo, or use the GHCR image below).
services:
  cadstudio:
    build: .
    # Or, without building yourself:
    # image: ghcr.io/allard-code/cadstudio:latest
    container_name: cadstudio
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      # Required whenever the port is reachable from other machines. Generate one with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      CADSTUDIO_TOKEN: ${CADSTUDIO_TOKEN:?set CADSTUDIO_TOKEN in .env}
      # The address you/Claude use to reach the server (used for download links returned to Claude)
      CADSTUDIO_PUBLIC_URL: ${CADSTUDIO_PUBLIC_URL:-http://localhost:8765}
      TZ: ${TZ:-Europe/Amsterdam}
      # printer for slice_plate (OrcaSlicer system profile)
      CADSTUDIO_PRINTER: ${CADSTUDIO_PRINTER:-Anycubic Kobra S1 0.4 nozzle}
      CADSTUDIO_PRINTER_VENDOR: ${CADSTUDIO_PRINTER_VENDOR:-Anycubic}
      PUID: 1000   # owner of the files in ./data
      PGID: 1000
    volumes:
      # projects, exports and the inbox (drop STL/3MF files here to import them)
      - ./data:/data
